apiVersion: apps/v1
kind: Deployment
metadata:
  name: floci-ui
  namespace: floci
spec:
  replicas: 1
  selector:
    matchLabels:
      app: floci-ui
  template:
    metadata:
      labels:
        app: floci-ui
    spec:
      enableServiceLinks: false
      containers:
        - name: floci-ui
          image: floci/floci-ui:latest
          ports:
            - containerPort: 4500
            - containerPort: 4501
          env:
            - name: FLOCI_ENDPOINT
              value: http://floci.floci.svc.cluster.local:4566
            - name: PORT
              value: "4501"
            - name: AWS_REGION
              value: us-east-1
            # Floci/LocalStack-style emulators don't validate credentials —
            # this well-known "test"/"test" pair is the universal convention
            # for talking to them, not a real secret (constitution Principle
            # V is about real credentials).
            - name: AWS_ACCESS_KEY_ID
              value: test
            - name: AWS_SECRET_ACCESS_KEY
              value: test
          readinessProbe:
            httpGet:
              path: /api/health
              port: 4501
            initialDelaySeconds: 5
