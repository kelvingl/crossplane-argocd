apiVersion: apps/v1
kind: Deployment
metadata:
  name: floci
  namespace: floci
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: floci
  template:
    metadata:
      labels:
        app: floci
    spec:
      # Kubernetes auto-injects FLOCI_PORT=tcp://<clusterIP>:4566 from the
      # "floci" Service into every pod in this namespace, which collides
      # with Floci's own FLOCI_PORT config property (it expects an integer,
      # not a URL) and crashes on boot. Disable that injection.
      enableServiceLinks: false
      containers:
        - name: floci
          image: floci/floci:latest
          ports:
            - containerPort: 4566
          env:
            # Must match the in-cluster Service DNS name — Floci uses this to
            # build the URLs it hands back to clients (e.g. bucket location).
            - name: FLOCI_HOSTNAME
              value: floci.floci.svc.cluster.local
            - name: FLOCI_STORAGE_MODE
              value: persistent
            - name: FLOCI_STORAGE_PERSISTENT_PATH
              value: /app/data
          volumeMounts:
            - name: data
              mountPath: /app/data
          readinessProbe:
            tcpSocket:
              port: 4566
            initialDelaySeconds: 5
          livenessProbe:
            tcpSocket:
              port: 4566
            initialDelaySeconds: 15
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: floci-data
