{{- if not .Values.spoke }}
{{- fail "values.spoke é obrigatório (ex.: spoke-01)" }}
{{- end }}
{{- $secretName := printf "%s-kubeconfig" .Values.spoke }}
{{- $kubeSecret := lookup "v1" "Secret" .Values.kubeconfigNamespace $secretName }}
{{- if not $kubeSecret }}
{{- fail (printf "Secret %s/%s não encontrado — rode scripts/03-register-spokes.sh antes de sincronizar este chart" .Values.kubeconfigNamespace $secretName) }}
{{- end }}
{{- $kubeconfig := index $kubeSecret.data "kubeconfig" | b64dec | fromYaml }}
{{- $cluster := (index $kubeconfig.clusters 0).cluster }}
{{- $user := (index $kubeconfig.users 0).user }}
{{- $certData := index $user "client-certificate-data" }}
{{- $keyData := index $user "client-key-data" }}
apiVersion: v1
kind: Secret
metadata:
  name: cluster-{{ .Values.spoke }}
  namespace: argocd
  labels:
    argocd.argoproj.io/secret-type: cluster
type: Opaque
stringData:
  name: {{ .Values.spoke }}
  server: {{ $cluster.server }}
  config: |
    {"tlsClientConfig":{"insecure":true,"certData":"{{ $certData }}","keyData":"{{ $keyData }}"}}
