# O Secret "spoke-02-kubeconfig" é criado fora do Git por
# scripts/03-register-spokes.sh (contém o kubeconfig do cluster spoke-02,
# com o server reescrito para o nome do container na rede docker
# compartilhada, ex: https://k3d-spoke-02-server-0:6443).
apiVersion: kubernetes.crossplane.io/v1alpha1
kind: ProviderConfig
metadata:
  name: spoke-02
  labels:
    lab.example.org/dataplane: spoke-02
spec:
  credentials:
    source: Secret
    secretRef:
      namespace: crossplane-system
      name: spoke-02-kubeconfig
      key: kubeconfig
