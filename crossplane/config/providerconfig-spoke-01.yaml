# O Secret "vc-spoke-01" é gerado em tempo de execução pelo próprio chart
# do vcluster (compositions/dataplane-cluster), no namespace "spoke-01" —
# não mais criado por script (feature 003 substitui o cluster k3d real
# spoke-01 por esse vcluster; ver specs/003-vcluster-dataplanes/).
apiVersion: kubernetes.crossplane.io/v1alpha1
kind: ProviderConfig
metadata:
  name: spoke-01
  labels:
    lab.example.org/dataplane: spoke-01
spec:
  credentials:
    source: Secret
    secretRef:
      namespace: spoke-01
      name: vc-spoke-01
      key: config
