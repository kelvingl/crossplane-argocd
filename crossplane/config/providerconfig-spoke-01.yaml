# O Secret "spoke-01-kubeconfig" é criado fora do Git por
# scripts/03-register-spokes.sh (contém o kubeconfig do cluster spoke-01,
# com o server reescrito para o nome do container na rede docker
# compartilhada, ex: https://k3d-spoke-01-server-0:6443).
apiVersion: kubernetes.crossplane.io/v1alpha1
kind: ProviderConfig
metadata:
  name: spoke-01
  labels:
    lab.example.org/dataplane: spoke-01
spec:
  credentials:
    source: Secret
    secretRef:
      namespace: crossplane-system
      name: spoke-01-kubeconfig
      key: kubeconfig
