# Composition de teste do modelo hub-and-spoke: a partir de um claim
# DataPlane no hub, cria Namespace + Deployment + Service no cluster spoke
# indicado em spec.parameters.spoke, usando o provider-kubernetes e o
# ProviderConfig homônimo (crossplane/config/providerconfig-spoke-*.yaml).
apiVersion: apiextensions.crossplane.io/v1
kind: Composition
metadata:
  name: xdataplanes.lab.example.org
  labels:
    lab.example.org/provider: kubernetes
spec:
  compositeTypeRef:
    apiVersion: lab.example.org/v1alpha1
    kind: XDataPlane
  resources:
    - name: namespace
      base:
        apiVersion: kubernetes.crossplane.io/v1alpha2
        kind: Object
        spec:
          forProvider:
            manifest:
              apiVersion: v1
              kind: Namespace
              metadata: {}
          providerConfigRef:
            name: placeholder
      patches:
        - type: CombineFromComposite
          combine:
            variables:
              - fromFieldPath: metadata.name
            strategy: string
            string:
              fmt: "dp-%s"
          toFieldPath: spec.forProvider.manifest.metadata.name
        - type: FromCompositeFieldPath
          fromFieldPath: spec.parameters.spoke
          toFieldPath: spec.providerConfigRef.name

    - name: deployment
      base:
        apiVersion: kubernetes.crossplane.io/v1alpha2
        kind: Object
        spec:
          forProvider:
            manifest:
              apiVersion: apps/v1
              kind: Deployment
              metadata: {}
              spec:
                replicas: 1
                selector:
                  matchLabels:
                    app: dataplane-demo
                template:
                  metadata:
                    labels:
                      app: dataplane-demo
                  spec:
                    containers:
                      - name: app
                        image: nginxdemos/hello
                        ports:
                          - containerPort: 80
          providerConfigRef:
            name: placeholder
      patches:
        - type: CombineFromComposite
          combine:
            variables:
              - fromFieldPath: metadata.name
            strategy: string
            string:
              fmt: "dp-%s"
          toFieldPath: spec.forProvider.manifest.metadata.namespace
        - type: CombineFromComposite
          combine:
            variables:
              - fromFieldPath: metadata.name
            strategy: string
            string:
              fmt: "dataplane-%s"
          toFieldPath: spec.forProvider.manifest.metadata.name
        - type: FromCompositeFieldPath
          fromFieldPath: spec.parameters.spoke
          toFieldPath: spec.providerConfigRef.name
        - type: FromCompositeFieldPath
          fromFieldPath: spec.parameters.image
          toFieldPath: spec.forProvider.manifest.spec.template.spec.containers[0].image
        - type: FromCompositeFieldPath
          fromFieldPath: spec.parameters.replicas
          toFieldPath: spec.forProvider.manifest.spec.replicas

    - name: service
      base:
        apiVersion: kubernetes.crossplane.io/v1alpha2
        kind: Object
        spec:
          forProvider:
            manifest:
              apiVersion: v1
              kind: Service
              metadata: {}
              spec:
                selector:
                  app: dataplane-demo
                ports:
                  - port: 80
                    targetPort: 80
          providerConfigRef:
            name: placeholder
      patches:
        - type: CombineFromComposite
          combine:
            variables:
              - fromFieldPath: metadata.name
            strategy: string
            string:
              fmt: "dp-%s"
          toFieldPath: spec.forProvider.manifest.metadata.namespace
        - type: CombineFromComposite
          combine:
            variables:
              - fromFieldPath: metadata.name
            strategy: string
            string:
              fmt: "dataplane-%s"
          toFieldPath: spec.forProvider.manifest.metadata.name
        - type: FromCompositeFieldPath
          fromFieldPath: spec.parameters.spoke
          toFieldPath: spec.providerConfigRef.name
