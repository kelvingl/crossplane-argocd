apiVersion: v1
kind: ConfigMap
metadata:
  name: gogs-app-ini
  namespace: gogs
data:
  app.ini: |
    RUN_MODE = prod

    [database]
    TYPE = sqlite3
    PATH = /data/gogs/data/gogs.db

    [repository]
    ROOT = /data/gogs/git/gogs-repositories

    [server]
    DOMAIN           = gogs.gogs.svc.cluster.local
    HTTP_PORT        = 3000
    EXTERNAL_URL     = http://gogs.gogs.svc.cluster.local:3000/
    DISABLE_SSH      = true
    START_SSH_SERVER = false
    LANDING_URL      = /explore

    [security]
    INSTALL_LOCK = true
    SECRET_KEY   = lab-secret-key-change-me

    [auth]
    DISABLE_REGISTRATION  = false
    REQUIRE_SIGNIN_VIEW   = false
    ENABLE_REGISTRATION_CAPTCHA = false

    [log]
    MODE      = console
    LEVEL     = Info
    ROOT_PATH = /app/gogs/log
