apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: crossplane-compositions-s3
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "1"
spec:
  project: default
  source:
    repoURL: http://gogs.gogs.svc.cluster.local:3000/gitadmin/platform.git
    targetRevision: main
    path: compositions/s3-bucket/chart
    helm:
      releaseName: s3-bucket
  destination:
    server: https://kubernetes.default.svc
    namespace: crossplane-system
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
    retry:
      limit: 10
      backoff:
        duration: 10s
        factor: 2
        maxDuration: 3m
