apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: dataplanes
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "2"
spec:
  goTemplate: true
  goTemplateOptions:
    - missingkey=error
  generators:
    - git:
        repoURL: http://gogs.gogs.svc.cluster.local:3000/gitadmin/dataplanes.git
        revision: main
        files:
          - path: "dataplanes/*.yaml"
  template:
    metadata:
      name: "dataplane-{{.cluster}}"
      namespace: argocd
      annotations:
        argocd.argoproj.io/sync-wave: "2"
    spec:
      project: default
      source:
        repoURL: http://gogs.gogs.svc.cluster.local:3000/gitadmin/platform.git
        targetRevision: main
        path: charts/dataplane-cluster
        helm:
          releaseName: "dataplane-{{.cluster}}"
          valuesObject:
            cluster: "{{.cluster}}"
            charts: {{.charts | toJson}}
            compositions: {{.compositions | toJson}}
      destination:
        server: https://kubernetes.default.svc
        namespace: argocd
      syncPolicy:
        automated:
          prune: true
          selfHeal: true
