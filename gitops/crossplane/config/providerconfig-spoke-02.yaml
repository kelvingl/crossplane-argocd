# O Secret "vc-spoke-02" é gerado em tempo de execução pelo próprio chart
# do vcluster (compositions/dataplane-cluster), no namespace "spoke-02" —
# não mais criado por script (feature 003 substitui o cluster k3d real
# spoke-02 por esse vcluster; ver specs/003-vcluster-dataplanes/).
apiVersion: kubernetes.crossplane.io/v1alpha1
kind: ProviderConfig
metadata:
  name: spoke-02
  labels:
    lab.example.org/dataplane: spoke-02
spec:
  credentials:
    source: Secret
    secretRef:
      namespace: spoke-02
      name: vc-spoke-02
      key: config
