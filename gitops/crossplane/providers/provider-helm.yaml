# provider-helm installs arbitrary Helm charts (for this repo: the vcluster
# chart, via the XDataPlane Composition) — the chart's contents aren't known
# ahead of time, so it needs broad permissions, not a scoped ClusterRole.
#
# The "aggregate-to-crossplane" label trick this repo uses for
# provider-kubernetes-secrets does NOT work for this purpose: that role only
# aggregates into Crossplane's own core ServiceAccount (bound via a
# ClusterRoleBinding scoped to "crossplane", not to individual providers).
# Each provider gets its own auto-generated "system" ClusterRole limited to
# its own CRDs plus baseline secrets/configmaps/events/leases access — no
# hook to extend it. Confirmed by testing: a Release creating a Namespace was
# rejected ("cannot create resource namespaces at the cluster scope") even
# with the aggregated role in place.
#
# Fix, matching provider-helm's own official in-cluster example
# (examples/cluster/provider-config/provider-incluster.yaml at v1.4.0): pin
# the provider's ServiceAccount name via a DeploymentRuntimeConfig (otherwise
# it's a per-revision generated name, unusable in a stable ClusterRoleBinding),
# then bind that fixed name directly to the built-in cluster-admin role.
apiVersion: pkg.crossplane.io/v1
kind: Provider
metadata:
  name: provider-helm
spec:
  package: xpkg.crossplane.io/crossplane-contrib/provider-helm:v1.4.0
  runtimeConfigRef:
    apiVersion: pkg.crossplane.io/v1beta1
    kind: DeploymentRuntimeConfig
    name: provider-helm
---
apiVersion: pkg.crossplane.io/v1beta1
kind: DeploymentRuntimeConfig
metadata:
  name: provider-helm
spec:
  serviceAccountTemplate:
    metadata:
      name: provider-helm
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: provider-helm-cluster-admin
subjects:
  - kind: ServiceAccount
    name: provider-helm
    namespace: crossplane-system
roleRef:
  kind: ClusterRole
  name: cluster-admin
  apiGroup: rbac.authorization.k8s.io
