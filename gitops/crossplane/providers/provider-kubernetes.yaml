apiVersion: pkg.crossplane.io/v1
kind: Provider
metadata:
  name: provider-kubernetes
spec:
  package: xpkg.upbound.io/crossplane-contrib/provider-kubernetes:v1.3.1
---
# Crossplane's RBAC manager auto-aggregates any ClusterRole carrying this
# label into a role bound to every provider ServiceAccount, so
# provider-kubernetes can read the spoke kubeconfig Secrets referenced by
# the ProviderConfigs, without knowing the per-revision ServiceAccount name.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: provider-kubernetes-secrets
  labels:
    rbac.crossplane.io/aggregate-to-crossplane: "true"
rules:
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["get", "list", "watch"]
