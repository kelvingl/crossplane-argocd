# Dashboard espera esses três Secrets já existirem (ele escreve nele em
# runtime — chave de assinatura do CSRF, certs, etc. — mas não os cria do
# zero); sem eles, o container entra em panic na inicialização
# ("secrets \"kubernetes-dashboard-csrf\" not found", confirmado testando).
# Mesmos nomes do manifest oficial (aio/deploy/recommended.yaml), só vazios.
apiVersion: v1
kind: Secret
metadata:
  name: kubernetes-dashboard-certs
type: Opaque
---
apiVersion: v1
kind: Secret
metadata:
  name: kubernetes-dashboard-csrf
type: Opaque
---
apiVersion: v1
kind: Secret
metadata:
  name: kubernetes-dashboard-key-holder
type: Opaque
