apiVersion: v1
kind: Service
metadata:
  name: registry
  namespace: registry
spec:
  # Pinned: the hub node's containerd can't resolve *.svc.cluster.local (that
  # only works inside pod network namespaces), so its registries.yaml mirror
  # config redirects pulls to this fixed IP instead of a DNS name.
  clusterIP: 10.43.0.50
  selector:
    app: registry
  ports:
    - port: 5000
      targetPort: 5000
      appProtocol: https
