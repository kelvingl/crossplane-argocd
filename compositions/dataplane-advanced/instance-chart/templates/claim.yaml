{{- if not .Values.spoke -}}
{{- fail "values.yaml must set 'spoke' (see specs/002-golang-composition-pipeline/contracts/dataplane-instance-values.md)" -}}
{{- end -}}
apiVersion: lab.example.org/v1alpha1
kind: AdvancedDataPlane
metadata:
  name: {{ .Release.Name }}
  namespace: default
spec:
  compositionRef:
    name: xdataplaneadvanceds.lab.example.org
  parameters:
    spoke: {{ .Values.spoke | quote }}
    image: {{ .Values.image | quote }}
    replicas: {{ .Values.replicas }}
    config:
      {{- toYaml .Values.config | nindent 6 }}
